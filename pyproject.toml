[project]
name = "studyflow-mcp"
version = "1.9.8"
description = "StudyFlow MCP for Chaoxing course tasks and exams"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["mcp>=2,<3", "requests>=2.31", "cryptography>=42", "playwright>=1.50", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
desktop = ["PyQt6>=6.6"]
test = ["pytest>=8", "pytest-asyncio"]
build = ["PyInstaller>=6.16"]

[project.scripts]
studyflow = "chaoxing_learning_mcp.studyflow:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chaoxing_learning_mcp = ["assets/*.js", "assets/*.cjs", "assets/*.json"]

